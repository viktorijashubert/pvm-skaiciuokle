<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PVM skaičiuoklė</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #4aa3f5;
      --green: #62cd47;
      --text: #222;
      --line: #d8d8d8;
      --head: #e8e8e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--text);
      font-family: Jost, Arial, sans-serif;
      font-size: 16px;
    }
    .widget {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px 48px;
      align-items: start;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .field { margin: 0 0 22px; }
    .label {
      display: block;
      margin: 0 0 10px;
      font-size: 16px;
    }
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .seg button {
      appearance: none;
      background: #fff;
      color: #222;
      border: 1px solid #ececec;
      border-radius: 6px;
      min-height: 44px;
      padding: 10px 18px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04);
    }
    .seg button:hover {
      box-shadow: 0 3px 6px rgba(0,0,0,.10);
    }
    .seg button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: none;
    }
    .rates {
      display: grid;
      grid-template-columns: repeat(5, 72px);
      gap: 10px;
      width: max-content;
      max-width: 100%;
    }
    .rates button {
      width: 72px;
      min-width: 72px;
      padding: 10px 0;
      text-align: center;
    }
    @media (max-width: 420px) {
      .rates {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        width: 100%;
      }
      .rates button { width: 100%; min-width: 0; }
    }
    input[type="text"] {
      width: 160px;
      max-width: 100%;
      min-height: 44px;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 8px 12px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 12px 14px;
      text-align: left;
    }
    thead th {
      background: var(--head);
      font-weight: 700;
    }
    td.num, th.num {
      text-align: right;
      white-space: nowrap;
      font-weight: 700;
    }
    tr.total td {
      background: var(--green);
      color: #fff;
      font-weight: 700;
      border-color: var(--green);
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="grid">
      <div>
        <div class="field">
          <span class="label">Veiksmas:</span>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="add" class="active">Pridėti PVM</button>
            <button type="button" data-mode="extract">Išskaičiuoti PVM</button>
          </div>
        </div>

        <div class="field">
          <span class="label">PVM tarifas:</span>
          <div class="seg rates" id="rateSeg">
            <button type="button" data-rate="21" class="active">21%</button>
            <button type="button" data-rate="12">12%</button>
            <button type="button" data-rate="9">9%</button>
            <button type="button" data-rate="5">5%</button>
            <button type="button" data-rate="0">0%</button>
          </div>
        </div>

        <div class="field">
          <label class="label" id="amountLabel" for="amount">Suma be PVM (€):</label>
          <input id="amount" type="text" inputmode="decimal" value="100" autocomplete="off" />
        </div>
      </div>

      <div>
        <table>
          <thead>
            <tr>
              <th>Rezultatas</th>
              <th class="num" id="resultHead">121,00 €</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Suma be PVM</td>
              <td class="num" id="net">100,00 €</td>
            </tr>
            <tr>
              <td>PVM <span id="vatRateLabel">21%</span></td>
              <td class="num" id="vat">21,00 €</td>
            </tr>
            <tr class="total">
              <td>Suma su PVM</td>
              <td class="num" id="gross">121,00 €</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const state = { mode: "add", rate: 21 };
    const amountEl = document.getElementById("amount");
    const amountLabel = document.getElementById("amountLabel");
    const netEl = document.getElementById("net");
    const vatEl = document.getElementById("vat");
    const grossEl = document.getElementById("gross");
    const resultHead = document.getElementById("resultHead");
    const vatRateLabel = document.getElementById("vatRateLabel");

    function parseAmount(raw) {
      let s = String(raw || "").trim().replace(/\s/g, "").replace(",", ".");
      if (!s) return NaN;
      const n = Number(s);
      if (!Number.isFinite(n) || n < 0 || n > 1e9) return NaN;
      return n;
    }
    function money(n) { return n.toFixed(2).replace(".", ",") + " €"; }
    function round2(n) { return Math.round(n * 100) / 100; }

    function calc() {
      const rate = state.rate / 100;
      const input = parseAmount(amountEl.value);
      vatRateLabel.textContent = state.rate + "%";
      if (!Number.isFinite(input)) {
        netEl.textContent = vatEl.textContent = grossEl.textContent = resultHead.textContent = "—";
        return;
      }
      let net, vat, gross;
      if (state.mode === "add") {
        net = round2(input);
        vat = round2(net * rate);
        gross = round2(net + vat);
      } else {
        gross = round2(input);
        net = round2(gross / (1 + rate));
        vat = round2(gross - net);
      }
      netEl.textContent = money(net);
      vatEl.textContent = money(vat);
      grossEl.textContent = money(gross);
      resultHead.textContent = money(state.mode === "add" ? gross : net);
    }

    function setActive(group, key, value) {
      group.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("active", b.dataset[key] === String(value));
      });
    }

    document.getElementById("modeSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.mode = btn.dataset.mode;
      setActive(e.currentTarget, "mode", state.mode);
      amountLabel.textContent = state.mode === "add" ? "Suma be PVM (€):" : "Suma su PVM (€):";
      calc();
    });
    document.getElementById("rateSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.rate = Number(btn.dataset.rate);
      setActive(e.currentTarget, "rate", state.rate);
      calc();
    });
    amountEl.addEventListener("input", calc);
    calc();
  </script>
</body>
</html>
